name: sports-prediction-platform

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["core", "all"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_prediction}
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sports} -d ${POSTGRES_DB:-sports_prediction}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    profiles: ["core", "all"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:30.1
    profiles: ["search", "all"]
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-local-typesense-key}", "--enable-cors"]
    ports:
      - "${TYPESENSE_BIND_ADDRESS:-127.0.0.1}:${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mock", "all"]
    ports:
      - "${MAILHOG_BIND_ADDRESS:-127.0.0.1}:${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_BIND_ADDRESS:-127.0.0.1}:${MAILHOG_UI_PORT:-8025}:8025"

  mock-api-football:
    image: nginx:1.27-alpine
    profiles: ["mock", "core", "all"]
    ports:
      - "${MOCK_API_FOOTBALL_BIND_ADDRESS:-127.0.0.1}:${MOCK_API_FOOTBALL_PORT:-8090}:80"
    volumes:
      - ../mock-api-football/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../mock-api-football/fixtures:/usr/share/nginx/html/fixtures:ro
    restart: unless-stopped

  api:
    profiles: ["core", "all"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-change-me}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://sports:sports@postgres:5432/sports_prediction?sslmode=disable}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      ACCA_DB_SCHEMA: ${ACCA_DB_SCHEMA:-public}
      ACCA_REDIS_NAMESPACE: ${ACCA_REDIS_NAMESPACE:-acca}
      ACCA_REDIS_TTL_SECONDS: ${ACCA_REDIS_TTL_SECONDS:-15}
      ACCA_INVENTORY_V2_ENABLED: ${ACCA_INVENTORY_V2_ENABLED:-false}
      OPENAPI_PATH: /contracts/openapi.yaml
      API_SERVICE_ENABLE_REAL_PROVIDER_CALLS: ${API_SERVICE_ENABLE_REAL_PROVIDER_CALLS:-false}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT:-2750ms}
      AUTH_REQUEST_TIMEOUT: ${AUTH_REQUEST_TIMEOUT:-8s}
      PUBLIC_RESULT_DETAIL_HOURS: ${PUBLIC_RESULT_DETAIL_HOURS:-24}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-65536}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      GUEST_ANALYSIS_VIEW_LIMIT: ${GUEST_ANALYSIS_VIEW_LIMIT:-4}
      GUEST_ANALYSIS_WINDOW: ${GUEST_ANALYSIS_WINDOW:-168h}
      USER_SESSION_TTL: ${USER_SESSION_TTL:-720h}
      ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-8h}
      ADMIN_MFA_ENABLED: ${ADMIN_MFA_ENABLED:-true}
      TYPESENSE_URL: ${TYPESENSE_URL:-http://typesense:8108}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-local-typesense-key}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-30m}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      BILLING_MODE: ${BILLING_MODE:-disabled}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-sandbox}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/readyz | grep -q ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    profiles: ["core", "all"]
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-change-me}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://sports:sports@postgres:5432/sports_prediction?sslmode=disable}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379/0}
      ACCA_DB_SCHEMA: ${ACCA_DB_SCHEMA:-public}
      ACCA_INVENTORY_V2_ENABLED: ${ACCA_INVENTORY_V2_ENABLED:-false}
      MOCK_API_FOOTBALL_URL: http://mock-api-football
      API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
      ENABLE_REAL_API_FOOTBALL_CALLS: ${ENABLE_REAL_API_FOOTBALL_CALLS:-false}
      ENABLE_MOCK_API_FOOTBALL_CALLS: ${ENABLE_MOCK_API_FOOTBALL_CALLS:-}
      # Off unless a capture has confirmed the embedded statistics shape;
      # see services/worker/cmd/capturefixtureids.
      INPLAY_STATISTICS_POLL_ENABLED: ${INPLAY_STATISTICS_POLL_ENABLED:-false}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      FOOTBALL_PROVIDER: ${FOOTBALL_PROVIDER:-api-football}
      FOOTBALL_DATA_ORG_BASE_URL: ${FOOTBALL_DATA_ORG_BASE_URL:-https://api.football-data.org/v4}
      ENABLE_REAL_FOOTBALL_DATA_ORG_CALLS: ${ENABLE_REAL_FOOTBALL_DATA_ORG_CALLS:-false}
      FOOTBALL_DATA_ORG_API_KEY: ${FOOTBALL_DATA_ORG_API_KEY:-}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-30s}
      WORKER_QUEUE_CONCURRENCY: ${WORKER_QUEUE_CONCURRENCY:-4}
      WORKER_DB_MAX_OPEN_CONNS: ${WORKER_DB_MAX_OPEN_CONNS:-12}
      WORKER_DB_MAX_IDLE_CONNS: ${WORKER_DB_MAX_IDLE_CONNS:-6}
      PROVIDER_SCHEDULE_INTERVAL: ${PROVIDER_SCHEDULE_INTERVAL:-4h}
      PREDICTION_SCHEDULE_INTERVAL: ${PREDICTION_SCHEDULE_INTERVAL:-15m}
      RECOMMENDATION_SCHEDULE_INTERVAL: ${RECOMMENDATION_SCHEDULE_INTERVAL:-15m}
      ENABLE_DESTRUCTIVE_RETENTION: ${ENABLE_DESTRUCTIVE_RETENTION:-false}
      ENABLE_RAW_PREDICTION_DRAIN: ${ENABLE_RAW_PREDICTION_DRAIN:-false}
      RAW_PREDICTION_DRAIN_BATCH_SIZE: ${RAW_PREDICTION_DRAIN_BATCH_SIZE:-1000}
      RAW_PREDICTION_DRAIN_MAX_BATCHES: ${RAW_PREDICTION_DRAIN_MAX_BATCHES:-10}
      ENABLE_FIXTURE_SNAPSHOTS: ${ENABLE_FIXTURE_SNAPSHOTS:-false}
      ENABLE_FIXTURE_EVENTS: ${ENABLE_FIXTURE_EVENTS:-false}
      # Enforces the SEO fixture history gate. Read by the seo sweep only.
      # Defaults false to match the Go default, but note the pairing: the
      # fixture page gates its own robots tag unconditionally, so with this
      # off the sitemap advertises URLs the page serves as noindex.
      SEO_FIXTURE_HISTORY_GATE: ${SEO_FIXTURE_HISTORY_GATE:-false}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-true}
      PUBLIC_RESULT_DETAIL_HOURS: ${PUBLIC_RESULT_DETAIL_HOURS:-24}
      PREDICTION_RESULT_RAW_RETENTION_DAYS: ${PREDICTION_RESULT_RAW_RETENTION_DAYS:-2}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-50}
      NOTIFICATION_CONCURRENCY: ${NOTIFICATION_CONCURRENCY:-4}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FALLBACK_PROVIDERS: ${EMAIL_FALLBACK_PROVIDERS:-}
      CLOUDFLARE_EMAIL_SUPPORTS_HEADERS: ${CLOUDFLARE_EMAIL_SUPPORTS_HEADERS:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SokaLens}
      EMAIL_FROM_NOTIFICATIONS: ${EMAIL_FROM_NOTIFICATIONS:-notifications@sokalens.com}
      EMAIL_FROM_SUPPORT: ${EMAIL_FROM_SUPPORT:-support@sokalens.com}
      EMAIL_FROM_NOREPLY: ${EMAIL_FROM_NOREPLY:-no-reply@sokalens.com}
      EMAIL_TEST_TO: ${EMAIL_TEST_TO:-}
      MAILTRAP_HOST: ${MAILTRAP_HOST:-sandbox.smtp.mailtrap.io}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-587}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:-}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:-}
      MAILTRAP_ENCRYPTION: ${MAILTRAP_ENCRYPTION:-starttls}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-sandbox}
      WORKER_HEARTBEAT_PATH: /tmp/sports-prediction-worker.heartbeat
      WORKER_HEARTBEAT_MAX_AGE: ${WORKER_HEARTBEAT_MAX_AGE:-10m}
      PROVIDER_DAILY_LIMIT: ${PROVIDER_DAILY_LIMIT:-7500}
      PROVIDER_DAILY_RESERVE: ${PROVIDER_DAILY_RESERVE:-900}
      PROVIDER_MINUTE_LIMIT: ${PROVIDER_MINUTE_LIMIT:-300}
      PROVIDER_MINUTE_RESERVE: ${PROVIDER_MINUTE_RESERVE:-15}
      QUOTA_BACKFILL_MIN_SAFE_BUDGET: ${QUOTA_BACKFILL_MIN_SAFE_BUDGET:-200}
      QUOTA_BACKFILL_MAX_PER_CYCLE: ${QUOTA_BACKFILL_MAX_PER_CYCLE:-3}
      QUOTA_STATISTICS_BACKFILL_MAX_PER_CYCLE: ${QUOTA_STATISTICS_BACKFILL_MAX_PER_CYCLE:-0}
      QUOTA_BACKFILL_DAYS: ${QUOTA_BACKFILL_DAYS:-30}
      QUOTA_BACKFILL_MAX_REQUESTS_PER_DAY: ${QUOTA_BACKFILL_MAX_REQUESTS_PER_DAY:-1200}
      QUOTA_FIXED_DAILY_OVERHEAD: ${QUOTA_FIXED_DAILY_OVERHEAD:-900}
      QUOTA_LIVE_POLL_SECONDS: ${QUOTA_LIVE_POLL_SECONDS:-60}
      WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-3}
      WORKER_JOB_LEASE_DURATION: ${WORKER_JOB_LEASE_DURATION:-15m}
      WORKER_REQUEST_DEDUPE_TTL: ${WORKER_REQUEST_DEDUPE_TTL:-2m}
      # Bind all interfaces inside the container so Prometheus (same Docker
      # network) can scrape; never published to the host.
      WORKER_METRICS_ADDRESS: ${WORKER_METRICS_ADDRESS:-0.0.0.0:9091}
      # TheSportsDB (free reference metadata: logos/badges/squads).
      ENABLE_REAL_THE_SPORTS_DB_CALLS: ${ENABLE_REAL_THE_SPORTS_DB_CALLS:-false}
      THE_SPORTS_DB_BASE_URL: ${THE_SPORTS_DB_BASE_URL:-https://www.thesportsdb.com/api/v1/json/123/}
      THE_SPORTS_DB_API_KEY: ${THE_SPORTS_DB_API_KEY:-123}
      THE_SPORTS_DB_MAX_PER_CYCLE: ${THE_SPORTS_DB_MAX_PER_CYCLE:-20}
    depends_on:
      mock-api-football:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "worker", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      PREDICTION_API_BASE_URL: ${PREDICTION_API_BASE_URL:-http://api:8080}
      ACCA_INVENTORY_V2_ENABLED: ${ACCA_INVENTORY_V2_ENABLED:-false}
      ACCA_INVENTORY_READ_SOURCE: ${ACCA_INVENTORY_READ_SOURCE:-v2}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    profiles: ["frontend", "all"]

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    environment:
      ADMIN_API_BASE_URL: ${ADMIN_API_BASE_URL:-http://api:8080}
      ADMIN_API_BEARER_TOKEN: ${ADMIN_API_BEARER_TOKEN:-}
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-3001}:3001"
    profiles: ["frontend", "all"]

  ops-controller:
    build:
      context: ../..
      dockerfile: services/ops-controller/Dockerfile
      args:
        OPS_BUILD_VERSION: ${RELEASE_SHA:-dev}
    environment:
      OPS_ENV: ${OPS_ENV:-production}
      OPS_HTTP_ADDRESS: :8090
      OPS_AUTONOMY_MODE: observe
      OPS_LOG_LEVEL: ${OPS_LOG_LEVEL:-info}
      OPS_INCIDENT_STORE_ENABLED: ${OPS_INCIDENT_STORE_ENABLED:-false}
      OPS_ALERT_SIGNING_SECRET: ${OPS_ALERT_SIGNING_SECRET:-}
      # The incident store and the Telegram ops bridge are both Postgres-backed.
      OPS_DATABASE_URL: ${OPS_DATABASE_URL:-}
      # Telegram ops bridge (docs/operations/telegram-agent-ops.md). Outbound
      # only: the bridge long-polls Telegram and exposes no new port. The
      # bridge stays off unless OPS_TELEGRAM_ENABLED is explicitly true, and
      # an empty allowlist denies every sender rather than allowing all.
      OPS_TELEGRAM_ENABLED: ${OPS_TELEGRAM_ENABLED:-false}
      OPS_TELEGRAM_BOT_TOKEN: ${OPS_TELEGRAM_BOT_TOKEN:-}
      OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
      OPS_TELEGRAM_ALLOWED_USER_IDS: ${OPS_TELEGRAM_ALLOWED_USER_IDS:-}
      OPS_TELEGRAM_POLL_TIMEOUT_SECONDS: ${OPS_TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
      OPS_TELEGRAM_RUNBOOKS_ENABLED: ${OPS_TELEGRAM_RUNBOOKS_ENABLED:-false}
      OPS_TELEGRAM_SEND_RATE_PER_SEC: ${OPS_TELEGRAM_SEND_RATE_PER_SEC:-1}
      # Daily digest, sent through the same outbox as every other
      # notification. On by default: a bridge that says nothing at all is
      # indistinguishable from a bridge that has stopped.
      OPS_TELEGRAM_DIGEST_ENABLED: ${OPS_TELEGRAM_DIGEST_ENABLED:-true}
      OPS_TELEGRAM_DIGEST_HOUR: ${OPS_TELEGRAM_DIGEST_HOUR:-8}
      OPS_TELEGRAM_DIGEST_MINUTE: ${OPS_TELEGRAM_DIGEST_MINUTE:-0}
      # Notification fallback. Telegram must never be the only delivery path:
      # an outage there would otherwise lose the notification entirely.
      OPS_EMAIL_SMTP_ADDRESS: ${OPS_EMAIL_SMTP_ADDRESS:-}
      OPS_EMAIL_SMTP_USERNAME: ${OPS_EMAIL_SMTP_USERNAME:-}
      OPS_EMAIL_SMTP_PASSWORD: ${OPS_EMAIL_SMTP_PASSWORD:-}
      OPS_EMAIL_FROM_ADDRESS: ${OPS_EMAIL_FROM_ADDRESS:-}
      OPS_EMAIL_TO_ADDRESS: ${OPS_EMAIL_TO_ADDRESS:-}
      # /issue files a GitHub issue from incident context. Without a token the
      # command returns the assembled body as text rather than dropping it.
      OPS_GITHUB_TOKEN: ${OPS_GITHUB_TOKEN:-}
      OPS_GITHUB_OWNER: ${OPS_GITHUB_OWNER:-}
      OPS_GITHUB_REPO: ${OPS_GITHUB_REPO:-}
      # /budget reports spend as a percentage of this cap, so a wrong value
      # produces a confidently wrong escalation tier.
      OPS_AI_MONTHLY_CAP_USD: ${OPS_AI_MONTHLY_CAP_USD:-60}
      # /resources reads host CPU, memory and disk from the observability
      # stack already running in this network.
      OPS_PROMETHEUS_URL: ${OPS_PROMETHEUS_URL:-http://prometheus:9090}
      # Runbook surface. Container control needs the Docker socket, which is
      # root-equivalent on the host, so it stays off unless deliberately set.
      OPS_RUNBOOK_SERVICES: ${OPS_RUNBOOK_SERVICES:-}
      OPS_DOCKER_ENABLED: ${OPS_DOCKER_ENABLED:-false}
      OPS_DOCKER_SOCKET_PATH: ${OPS_DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPS_BIND_ADDRESS:-127.0.0.1}:${OPS_PORT:-8091}:8090"
    profiles: ["core", "all"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uptime:
    image: louislam/uptime-kuma:1
    ports:
      - "${UPTIME_BIND_ADDRESS:-127.0.0.1}:${UPTIME_PORT:-3002}:3001"
    volumes:
      - uptime_data:/app/data
    profiles: ["observability", "all"]

  backup:
    image: alpine:3.23
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    profiles: ["observability", "all"]

  # --- Observability stack (separate `observability` profile) ---------------
  # Metrics (Prometheus + node-exporter + cAdvisor), logs (Loki + Promtail),
  # and dashboards (Grafana). Everything binds to 127.0.0.1 only and is reached
  # from a desktop via SSH tunnel; see infra/observability/README.md.
  # The Go API's Prometheus endpoint (/v1/admin/observability/metrics) is
  # admin-gated, so host/container metrics come from node-exporter + cAdvisor.

  prometheus:
    image: prom/prometheus:v3.7.0
    profiles: ["observability", "all"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.11.0
    profiles: ["observability", "all"]
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      # This optional Linux collector is absent on the VPS kernel and otherwise
      # emits an error on every scrape.
      - "--no-collector.kernel_hung"
    ports:
      - "${NODE_EXPORTER_BIND_ADDRESS:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    profiles: ["observability", "all"]
    ports:
      - "${CADVISOR_BIND_ADDRESS:-127.0.0.1}:${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability", "all"]
    environment:
      # Credentials come from the env file (.env.prod); the fallback is a
      # non-secret placeholder that must be overridden in production.
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3004}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3004}:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.6.0
    profiles: ["observability", "all"]
    # The image runs as uid 10001; run as root so the named data volume (mounted
    # at /loki) is writable without a separate chown init step.
    user: root
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ../observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.6.0
    profiles: ["observability", "all"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  typesense_data:
  uptime_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
