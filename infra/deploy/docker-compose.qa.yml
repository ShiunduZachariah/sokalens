# QA overlay. There are exactly two environments: production and QA.
#
# QA is compose project `sokalens-qa`, run in a rootless Docker daemon by a
# non-root user on the production host, and served at qa.sokalens.com /
# qa-admin.sokalens.com. It was previously called `sokalens-dev` on
# dev.sokalens.com; that name is retired. There is no separate dev
# environment -- see docs/operations/environments.md before creating anything.
#
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/deploy/docker-compose.qa.yml \
#     --env-file .env.qa \
#     --profile core --profile frontend --profile search \
#     up -d
#
# ---------------------------------------------------------------------------
# Why this file exists
#
# The base compose declares `restart: unless-stopped` on twelve services but
# not on web, admin or typesense. Production never noticed, because
# docker-compose.prod.yml adds it to exactly those three. QA was running the
# base file with no overlay at all, so on 2026-09-16 at 04:33 every container
# stopped, everything with a restart policy came back, and web, admin and
# typesense stayed down -- silently, with a clean "Ready" in their logs and no
# error. The QA site had been dark ever since.
#
# That is the bug this overlay fixes. The resource limits are secondary.
#
# Ports are literal here, never read from the environment. The base file
# defaults web to 3000 and admin to 3001, which production holds on this same
# host; one missing variable in .env.qa would have QA fighting production for
# its ports. 13000/13001 are what the Caddyfile proxies the QA hosts to.

services:
  postgres:
    ports: !override
      - "127.0.0.1:15433:5432"
    restart: unless-stopped
    # QA's database name is literal here for the same reason the ports are.
    # The base file's defaults are *production's* names, so QA ran for months
    # as `sports`/`sports_prediction` -- production's identity, on production's
    # host, one mistyped port away from production's data, with nothing between
    # them but the password. `sports_prediction` was renamed to
    # `sports_prediction_qa` in place on 2026-09-18 (ALTER DATABASE, no volume
    # recreation, no data loss); .env.qa carries the matching URLs.
    #
    # The role is still `sports`, and that half is NOT done: renaming a
    # bootstrap superuser requires a second superuser to run
    # `ALTER ROLE sports RENAME TO sokalens_qa` from, and creating one is a
    # deliberate, separately-approved act. Until it lands, the role name is
    # shared with production and only the password differs. When it lands,
    # change the two names below and the three URLs in .env.qa together.
    #
    # These take effect at initdb only. An existing cluster keeps whatever it
    # was created with, so changing them here renames nothing -- it changes the
    # healthcheck, and a mismatch shows up as postgres never reporting healthy.
    environment:
      POSTGRES_DB: sports_prediction_qa
      POSTGRES_USER: sports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_prediction_qa"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    # Same logical name as production; COMPOSE_PROJECT_NAME prefixes it to
    # sokalens-qa_postgres_data, so the separation comes from the project and
    # from the rootless daemon rather than from a hand-kept name.
    volumes: !override
      - postgres_data:/var/lib/postgresql

  redis:
    ports: !override
      - "127.0.0.1:16379:6379"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-}"]

  api:
    ports: !override
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  worker:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # restart policy: the actual fix. Absent from the base file.
  web:
    ports: !override
      - "127.0.0.1:13000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M

  # restart policy: the actual fix. Absent from the base file.
  admin:
    ports: !override
      - "127.0.0.1:13001:3001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  # restart policy: the actual fix. Absent from the base file.
  typesense:
    ports: !override
      - "127.0.0.1:18108:8108"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M

  ops-controller:
    ports: !override
      - "127.0.0.1:18091:8090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # In the `core` profile, and production runs --profile core too, so production
  # already holds 8090 on this host.
  mock-api-football:
    ports: !override
      - "127.0.0.1:18090:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  postgres_data:
