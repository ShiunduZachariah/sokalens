# SokaLens Promtail configuration.
#
# Discovers running Docker containers via the Docker socket and tails their
# json-file logs, shipping them to Loki over HTTP. Only the application
# containers (api / worker / web / admin / ops-controller) are kept; the observability stack and
# data stores are dropped so they don't produce a self-referential log loop.
#
# The promtail container must mount:
#   - /var/run/docker.sock           (container discovery)
#   - /var/lib/docker/containers     (read the json-file logs)
#   - /data                          (persist the tail position)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(api|worker|web|admin|ops-controller)'
        action: keep
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(api|worker|web|admin|ops-controller)'
        replacement: '$1'
        target_label: 'service_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        replacement: '$1'
        target_label: 'container_name'
    pipeline_stages:
      # Unwrap Docker's json-file envelope: sets the real timestamp, the
      # `stream` (stdout/stderr) label, and the plain log line as output.
      - docker: {}
