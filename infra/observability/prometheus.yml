# SokaLens Prometheus configuration.
#
# Scrape targets:
#   - Prometheus itself (self-monitoring)
#   - node-exporter (host CPU/mem/disk/network)
#   - cAdvisor (per-container CPU/mem/network/disk)
#   - worker (quota planner + provider request accounting gauges)
#
# API request histograms and pool metrics use a separate Docker-only listener.
# Port 9092 is never published. The public admin metrics route remains gated.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Worker quota planner: projected demand vs remaining provider quota,
  # per-reason request accounting, queue depth, and throttle state.
  - job_name: worker
    static_configs:
      - targets: ["worker:9091"]

  - job_name: ops-controller
    static_configs:
      - targets: ["ops-controller:8090"]

  - job_name: api
    static_configs:
      - targets: ["api:9092"]
