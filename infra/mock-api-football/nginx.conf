# The rate-limit headers below are not decoration: the quota governor reads
# them off every response and refuses the next call when the remaining
# allowance is within the configured reserve. They used to say 100/day and
# 10/minute, which sit below the default reserves of 1500 and 15 -- so the
# first mock call answered and every call after it was refused with "daily
# provider quota reserve reached", a governor working correctly on numbers the
# mock had invented. They now describe the real plan: 75k/day, 450/minute.

# Only `?live=all` gets the live payload. `/fixtures` is also polled by date,
# by ids and by league, and answering those with this file would write three
# fixed fixtures onto every date QA ingests. An unmatched query keeps the same
# JSON 404 the rest of this mock returns.
map $arg_live $mock_live_fixtures {
    default "";
    all     "/fixtures/fixtures-live.json";
}

# Kickoff dates are the captured ones and the statuses are FT, both on purpose.
#
# A live status with a fixed date does not survive: the match-state reaper marks
# a fixture that claims to be in its second half hours after kickoff `unknown`,
# and the API then stops reading its timeline, so the feature looks broken when
# what is broken is the fixture. Rewriting the kickoff to "now" on each request
# is worse -- ingestion then sees the same provider fixture id at a new kickoff
# and mints a second canonical match for it, which is how QA ended up with two
# copies of every mock fixture while this was being tested.
#
# Finished fixtures are terminal, so they stay readable indefinitely, and the
# timeline is read for them (`timelineWorthReading` includes "finished"). The
# event writer does not care about status: it stores whatever the live poll
# returned. What this cannot exercise is the in-play *board*, which lists
# genuinely live matches; that needs a real fixture in play.

server {
    listen 80;
    server_name _;

    default_type application/json;

    location = /countries {
        add_header x-ratelimit-requests-limit "75000" always;
        add_header x-ratelimit-requests-remaining "74000" always;
        add_header X-RateLimit-Limit "450" always;
        add_header X-RateLimit-Remaining "449" always;
        root /usr/share/nginx/html;
        try_files /fixtures/countries.json =404;
    }

    # The bulk live poll the in-play features are built on. The events are
    # embedded in this response, which is the whole reason the timeline costs no
    # extra provider request -- so a mock that omits them cannot exercise the
    # writer at all, and QA had no way to test in-play before this existed.
    location = /fixtures {
        add_header x-ratelimit-requests-limit "75000" always;
        add_header x-ratelimit-requests-remaining "74000" always;
        add_header X-RateLimit-Limit "450" always;
        add_header X-RateLimit-Remaining "449" always;
        root /usr/share/nginx/html;
        error_page 404 = @route_not_found;
        try_files $mock_live_fixtures =404;
    }

    location @route_not_found {
        return 404 '{"errors":{"route":"not found"},"response":[]}';
    }

    location / {
        return 404 '{"errors":{"route":"not found"},"response":[]}';
    }
}
