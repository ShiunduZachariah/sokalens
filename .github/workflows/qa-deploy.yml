# Deploy the qa branch to the QA environment.
#
# Releases go qa first, then main, so the QA environment has to track the qa
# branch. The deploy job in ci.yml only handles main.
#
# All this job does is run scripts/qa/deploy.sh on the host. That script
# fetches origin/qa, resets the QA checkout to it, runs migrations and then
# scripts/qa/smoke.sh. Bringing QA up any other way -- a bare
# `docker compose up` -- once served 503s from healthy-looking containers
# because a migration had never been applied.
name: QA deploy

on:
  push:
    branches: [qa]
  # Lets the first run happen with someone watching, and a re-run without an
  # empty commit.
  workflow_dispatch:
    inputs:
      production_copy_test:
        description: Test qa on a scratch copy of production's football data instead of deploying
        type: boolean
        default: false
      replay_batches:
        description: Batches of 500 finished fixtures to replay in that test
        type: number
        default: 4

concurrency:
  # One at a time, and never cancelled midway: the script resets a live
  # checkout and runs migrations, and interrupting either leaves QA in a state
  # nobody chose.
  group: qa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Deliberately not gated on the test matrix. QA is where a bad build is
    # supposed to be found, so it tracks the branch; smoke.sh fails loudly at
    # the end if the result is broken, and the fix is another push.
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH to the VPS
        uses: ./.github/actions/vps-ssh
        with:
          private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          user: ${{ secrets.VPS_SSH_USER }}

      - name: Deploy qa to the QA environment
        if: ${{ !inputs.production_copy_test }}
        run: |
          ssh vps \
            'sudo -u dev env HOME=/home/dev bash /home/dev/sokalens/scripts/qa/deploy.sh'

      # Reads production and writes only to a scratch database in QA's PostgreSQL,
      # which it drops. See scripts/qa/production-copy-test.sh.
      - name: Test qa on a copy of production's football data
        if: ${{ inputs.production_copy_test && github.ref == 'refs/heads/qa' }}
        env:
          REPLAY_BATCHES: ${{ inputs.replay_batches }}
        run: |
          scp scripts/qa/production-copy-test.sh vps:/tmp/production-copy-test.sh
          ssh vps "REPLAY_BATCHES=${REPLAY_BATCHES} bash /tmp/production-copy-test.sh"
