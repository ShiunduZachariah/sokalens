        - daily_reserve
        - minute_limit
        - minute_remaining
        - minute_reserve
        - updated_at
      properties:
        daily_limit:
          type: integer
          minimum: 0
        daily_remaining:
          type: integer
          minimum: 0
        daily_reserve:
          type: integer
          minimum: 0
        minute_limit:
          type: integer
          minimum: 0
        minute_remaining:
          type: integer
          minimum: 0
        minute_reserve:
          type: integer
          minimum: 0
