            properties:
              market_key:
                $ref: "#/components/schemas/PredictionMarketKey"
              selection:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 100
              probability:
                type: number
                minimum: 0
                maximum: 1
              is_best_bet:
                type: boolean
            additionalProperties: false
        published_version:
          type: integer
          minimum: 1
        published_at:
          description: Prediction-engine generation time for the currently selected canonical version; use this as the prediction freshness timestamp.
          type: string
          format: date-time
        updated_at:
          description: Time the canonical prediction record last changed.
          type: string
          format: date-time
        last_evaluated_at:
          description: Most recent time the prediction engine evaluated this canonical prediction, including unchanged reevaluations.
          type: string
          format: date-time
      additionalProperties: false
    ProviderPredictionSummary:
      description: API-Football native prediction used as a fallback for a fixture SokaLens has not predicted itself. The canonical primitives (market_key, selection, confidence, published_version, published_at) mirror PredictionSummary so clients can render engine and provider items alike; the provider-specific fields (predicted_winner, win_or_draw, under_over, percent_*, advice) are preserved for administration.
      type: object
      required:
        - match_id
        - match_title
        - home_team
        - away_team
        - league_name
        - kickoff_at
        - match_status
        - predicted_winner
        - win_or_draw
        - under_over
        - percent_home
        - percent_draw
        - percent_away
        - advice
        - market_key
        - selection
        - confidence
        - published_version
        - published_at
      properties:
        match_id:
          type: integer
          format: int64
        match_title:
          type: string
        home_team:
          type: string
        away_team:
          type: string
        home_team_logo:
          type: string
          description: >-
            Crest URL for the home side, empty when the team has no logo on
            record. Spelled the same as on PredictionSummary so engine and
            provider rows render alike in one list.
        away_team_logo:
          type: string
          description: Crest URL for the away side; see home_team_logo.
        league_name:
          type: string
        kickoff_at:
          type: string
          format: date-time
        match_status:
          type: string
        predicted_winner:
          description: API-Football winner projection (team name).
          type: string
        win_or_draw:
          description: API-Football win-or-draw advice flag.
          type: boolean
        under_over:
          description: API-Football under/over projection label.
          type: string
        percent_home:
          type: number
          minimum: 0
          maximum: 100
        percent_draw:
          type: number
          minimum: 0
          maximum: 100
        percent_away:
          type: number
          minimum: 0
          maximum: 100
        advice:
          type: string
        market_key:
          $ref: "#/components/schemas/PredictionMarketKey"
        selection:
          description: Home, Away, or Draw derived from the provider winner projection.
          type: string
        confidence:
          description: Strongest of the provider's home/draw/away percentages on the shared 0-100 confidence scale.
          type: number
          minimum: 0
          maximum: 100
        published_version:
          description: Always 0 for provider fallback items (no version lineage).
          type: integer
          minimum: 0
        published_at:
          description: Time the provider prediction was captured.
          type: string
          format: date-time
      additionalProperties: false
